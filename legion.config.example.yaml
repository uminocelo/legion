# Configuração do Legion. Copie para legion.config.yaml e ajuste.
# Segredos (token etc.) ficam no .env, nunca aqui.
# Referência completa: docs/CONFIG.md

# Idioma padrão das mensagens: pt-BR ou en
locale: pt-BR
# Fuso usado para "dias" (streaks, diárias)
timezone: America/Sao_Paulo

# Bots ligados. O Cérebro é obrigatório quando qualquer outro está ligado.
# Disponíveis: cerebro, jarvis, herbie, sentinel e ultron (precisa do sentinel).
bots:
  - cerebro

# IDs dos canais (Discord → Configurações → Avançado → Modo desenvolvedor;
# depois botão direito no canal → Copiar ID). Use aspas.
channels:
  welcome: null # boas-vindas: onde o Cérebro recebe quem chega
  rules: null # regras
  registry: null # cartões públicos de novos mutantes (vazio = usa welcome)
  tutorial: null # H.E.R.B.I.E.: tutorial de quem tem DM fechada (vazio = usa welcome)
  events: null # eventos do ULTRON (o H.E.R.B.I.E. explica os anúncios aqui)
  combat: null # Sentinel: tópicos de combate
  missions: null # J.A.R.V.I.S.: tópicos das missões (vazio = channels.combat, senão o canal do comando)
  modQueue: null # Sentinel: fila de denúncias (só a staff vê)
  # trivia: usado por bots futuros
# Cargos: os padrões cobrem tudo. Para renomear ou mudar cores, copie a lista
# COMPLETA de docs/CONFIG.md para cá (a lista substitui a padrão inteira).
# O código usa sempre a "key"; o nome é só o que aparece no Discord.
# roles: [...]

cerebro:
  welcomePing: true # menciona o membro na mensagem de boas-vindas
  persistentWelcome: true # mantém uma mensagem fixa com o botão "Começar"
  publicRegistryCard: true # posta um cartão público quando alguém se registra
  codename:
    min: 2
    max: 32
  # Origens do cadastro, na ordem do menu (docs/UNIVERSE.md). Tire uma para escondê-la.
  # origins: [{ key: mutante }, { key: inumano }, { key: ciencia }, { key: tecnologia }, { key: mistico }, { key: cosmico }, { key: treinado }]
  # Equipes (docs/UNIVERSE.md#equipes): onde todo herói novo começa, e os dias entre duas trocas
  # pelas missões de recrutamento (a staff move com /cerebro equipe mover, sem esperar)
  teams:
    startFaction: independent
    switchCooldownDays: 30
  # Arquétipos oferecidos no cadastro
  archetypes: [Telepata, Elemental, Metamorfo, Velocista, Tanque, Tecnopata]
  # Catálogo de poderes no cadastro (docs/POWERS.md). O tipo do poder principal define o arquétipo.
  powers:
    enabled: true # false = volta o menu de arquétipos
    maxSecondary: 2 # poderes secundários (0 a 2)
    typeToArchetype:
      offensive: Metamorfo
      defensive: Tanque
      psionic: Telepata
      elemental: Elemental
      movement: Velocista
      utility: Tecnopata
    allowArchetypeChange: false # /heroi poderes e /heroi origem podem trocar o arquétipo
  # Cargos que o membro pode ligar/desligar sozinho
  optInRoles: [live_ping, rivals_vanguard, rivals_duelist, rivals_strategist]
  # Avisa a staff (report.flagged) após N tentativas de nome canon em X minutos
  canonAttemptFlag:
    count: 3
    windowMinutes: 10
  setup:
    # Canais que o "/cerebro setup canais:true" nunca deve tocar
    excludeChannelIds: []

# J.A.R.V.I.S.: trivia, XP, níveis, ranks e sequências. Ligue com bots: [cerebro, jarvis].
jarvis:
  trivia:
    categories: [quadrinhos, rivals, geral] # pacotes extras: ./data/content/trivia/*.yaml
    timeLimitSeconds: 20 # tempo para responder
    cooldownSeconds: 30 # espera entre perguntas
    noRepeatDays: 30 # não repete pergunta vista nesse período
    dailyXpCap: 300 # XP máximo de trivia por dia (acertos acima disso ainda contam para a sequência)
    baseXp: { facil: 10, normal: 15, dificil: 25 }
    speedBonusMax: 5 # bônus por responder rápido
    review: none # perguntas criadas pela staff no Discord: none (entram na hora) | second_staff (outra pessoa aprova)
  levels:
    levelFactor: 50 # XP do nível n = levelFactor × (n-1)²
    maxLevel: 50
  ranks: { recruta: 0, agente: 500, veterano: 2000 } # XP mínimo de cada rank (cargos do Cérebro)
  streak:
    bonusPerDay: 5 # bônus = bonusPerDay × dias seguidos
    bonusCap: 7 # até no máximo 7 dias
  leaderboard:
    size: 10
    channelCooldownSeconds: 15
  economy: # créditos. Sem dinheiro real (docs/ECONOMY.md)
    enabled: true
    war:
      winner: 50 # créditos para cada herói da facção vencedora que pontuou
  missions: # /missao: histórias com escolhas, sozinho ou em grupo (docs/MISSIONS.md)
    enabled: true
    rewards: # XP por tipo de missão (o arquivo da missão pode definir o seu)
      daily: { successXp: 40, failureXp: 10 }
      weekly: { successXp: 120, failureXp: 30 }
      story: { successXp: 80, failureXp: 20 }
    limits:
      dailyPerMember: 1 # missões diárias por membro por dia
      weeklyPerMember: 1 # missões semanais por membro por semana (segunda a domingo)
      storyRepeatable: false # cada história só uma vez
    choiceTimeoutMinutes: 10 # sem escolha → missão abandonada (em grupo, os votos já dados decidem)
    combatTimeoutMinutes: 15 # sem resultado da luta → fracasso
    lobbyTimeoutMinutes: 5 # tempo para o grupo se formar

# H.E.R.B.I.E.: tutorial, /ajuda, /regras, /idioma e dicas. Ligue com bots: [cerebro, jarvis, herbie].
herbie:
  delivery: dm # dm (com canal de reserva) ou channel
  tutorial:
    enabled: true
    allowSkip: true
  tips:
    enabled: false # dica diária
    channelId: null
    cron: "0 12 * * *" # no timezone acima
  explainWorldEvents: true

# Sentinel: combate, limites de uso e denúncias. Ligue com bots: [cerebro, jarvis, herbie, sentinel].
sentinel:
  combat:
    maxRounds: 20
    roundTimeoutSeconds: 45
    powerCooldownRounds: 3
    abandonAfterIdleRounds: 3
  training:
    cooldownSeconds: 300
    dummyAtkMultiplier: 0.7
  rateLimits:
    commandsPerMinute: 20
    componentsPer10Seconds: 15
    reportsPerHour: 3
    violationsToFlag: 5
  antiCheat:
    xpAnomalyPerHour: 600
    newAccountDays: 7
  moderation:
    enabled: true
    timeoutOptionsMinutes: [10, 60]

# ULTRON: inimigos escalados, invasão semanal e raids. Precisa do sentinel e de channels.events.
# Ligue com bots: [cerebro, jarvis, herbie, sentinel, ultron]. Detalhes em docs/WORLD_EVENTS.md.
ultron:
  combat:
    maxRounds: 20
  adaptive:
    enabled: false
  events:
    pingRoleKey: null # chave de um cargo mencionável; nunca @everyone
    announceMinutesBefore: 60
    strikeCooldownMinutes: 10
    hpPerParticipant: 300
    expectedParticipants: 8
    bossLevel: auto
    rewards: { victoryXp: 50, bonusXpMax: 50, participationXp: 15 }
  invasion:
    enabled: true
    cron: "0 20 * * 6" # sábado 20:00 no timezone acima
    durationMinutes: 60
    templateId: enxame-de-nanites
  raids:
    cron: null # ex.: "0 21 * * 3"; null = só pela staff
    durationMinutes: 45
    templateIds: [bastiao-prime]
  ai:
    provider: none # none | openai-compatible (veja docs/SELF_HOSTING.md)
    timeoutMs: 4000
    maxCallsPerHour: 30
  war:
    enabled: true
    length: month # month (começa no dia 1) ou um número de dias entre 7 e 90
    points:
      missionSuccess: 10
      missionFailure: 3
      strike: 2
      participation: 5
