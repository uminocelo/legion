name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: legion
          POSTGRES_PASSWORD: legion
          POSTGRES_DB: legion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legion" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (SQLite)
        run: pnpm test
      - name: Tests (Postgres)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://legion:legion@localhost:5432/legion_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: legion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and explains a missing config
        run: |
          out=$(docker run --rm legion:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "legion.config.yaml"
      - name: CLI is on PATH
        run: docker run --rm legion:ci legion --version
