# Glossário do /regras (pt-BR). Sobrescreva em ./data/content/glossary.pt-BR.yaml.
# bot: o termo só aparece quando esse bot está ligado.
- id: faccoes
  term: "Facções"
  aliases: [faccao, facção, x-men, irmandade, independente]
  summary: "Todo herói começa Independente. A facção (ou equipe) vira um cargo e aparece no /perfil e no /ranking."
  details: "Novos heróis começam na facção inicial do servidor (Independente). Quem se registrou antes das origens mantém a facção que escolheu. Por enquanto só a staff troca a facção. Ela soma pontos para o total da facção no /ranking. Não muda seus poderes nem limita com quem você joga."
  related: [origens, arquetipos, rank]
  bot: cerebro
- id: origens
  term: "Origens"
  aliases:
    [
      origem,
      mutante,
      inumano,
      ciencia,
      ciência,
      tecnologia,
      mistico,
      místico,
      cosmico,
      cósmico,
      treinado,
      /heroi origem,
    ]
  summary: "De onde vêm seus poderes: Mutante, Inumano, Ciência, Tecnologia, Místico, Cósmico ou Treinado. Você escolhe no cadastro."
  details: "A origem define quais poderes do catálogo você pode escolher; ela não muda atributos (eles vêm do arquétipo e do nível). Heróis registrados antes das origens viraram Mutante e podem trocar uma única vez com /heroi origem."
  related: [poderes, arquetipos]
  bot: cerebro
- id: arquetipos
  term: "Arquétipos"
  aliases: [arquetipo, arquétipo, classe]
  summary: "O tipo do seu herói (Telepata, Elemental, Metamorfo, Velocista, Tanque, Tecnopata). Definido pelo seu poder principal no cadastro."
  details: "O arquétipo vem do tipo do seu poder principal (ou do menu, se o servidor desligou o catálogo de poderes) e define seus atributos base de combate. A staff pode mudar a lista e qual tipo de poder leva a qual arquétipo."
  related: [faccoes, codinome]
  bot: cerebro
- id: poderes
  term: "Poderes"
  aliases:
    [
      catalogo,
      catálogo,
      poder principal,
      poderes secundarios,
      poderes secundários,
      /heroi poderes,
      /mutante poderes,
    ]
  summary: "No cadastro você escolhe 1 poder principal e até 2 secundários entre os poderes da sua origem. O tipo do principal define seu arquétipo."
  details: "São 6 tipos: ofensivo, defensivo, psiônico, elemental, movimento e utilitário. Os secundários aparecem na ficha e no cartão do /perfil, sem mudar atributos. Quem se registrou antes do catálogo usa /heroi poderes uma vez. Você também descreve o poder com suas palavras na ficha."
  related: [arquetipos, codinome]
  bot: cerebro
- id: codinome
  term: "Codinome"
  aliases: [nome, apelido, codename]
  summary: "O nome do seu herói. Precisa ser único no servidor e original — nada de nomes de heróis ou vilões existentes."
  details: "O codinome tem entre 2 e 32 caracteres (configurável). O Cérebro recusa nomes de personagens conhecidos, com ou sem acentos, números no lugar de letras ou espaços. Tentativas repetidas avisam a staff."
  related: [mutante-original]
  bot: cerebro
- id: mutante-original
  term: "Herói original"
  aliases: [personagem original, oc, canon, mutante original]
  summary: "Aqui você cria seu próprio herói. Personagens existentes da Marvel não podem ser usados como codinome ou ficha, mas podem aparecer nas histórias das missões."
  details: "A regra vale para codinomes, fichas e textos dos bots. Inspire-se à vontade, mas invente: nome, poder e história precisam ser seus. A staff pode pedir para você trocar."
  related: [codinome]
- id: xp
  term: "XP"
  aliases: [experiencia, experiência, pontos]
  summary: "Pontos que você ganha jogando (trivia, sequência, tutorial, eventos). Somam para o nível e o rank."
  details: "Todo XP fica registrado num histórico, então nada se perde nem é contado duas vezes. A trivia tem um limite diário de XP. A staff pode ajustar XP com motivo."
  related: [nivel, rank, sequencia, trivia]
  bot: jarvis
- id: nivel
  term: "Nível"
  aliases: [nivel, level, lvl]
  summary: "Sobe conforme seu XP total. O nível n pede 50 × (n−1)² XP (nível 2 com 50, nível 3 com 200…)."
  details: "O nível aparece no /perfil e no /ranking, com uma barra de progresso. A fórmula pode ser ajustada pela staff na configuração."
  related: [xp, rank]
  bot: jarvis
- id: rank
  term: "Rank"
  aliases: [patente, recruta, agente, veterano]
  summary: "Recruta, Agente (500 XP) e Veterano (2000 XP). O Cérebro troca o cargo automaticamente quando você cruza o limite."
  details: "O rank depende só do XP total. Se o XP cair abaixo do limite (ajuste da staff), o rank volta e o cargo também."
  related: [xp, nivel]
  bot: jarvis
- id: sequencia
  term: "Sequência"
  aliases: [streak, dias seguidos]
  summary: "Dias seguidos em que você ganhou XP. Cada dia ativo dá um bônus que cresce até 7 dias. Veja com /sequencia."
  details: "O dia segue o fuso do servidor. Uma trivia certa já conta, mesmo acima do limite diário. Se você pular um dia, a sequência recomeça; a melhor fica guardada."
  related: [xp, trivia]
  bot: jarvis
- id: trivia
  term: "Trivia"
  aliases: [quiz, pergunta, perguntas]
  summary: "Perguntas rápidas sobre quadrinhos, Marvel Rivals e cultura geral. Use /trivia; responder rápido vale mais XP."
  details: "Cada pergunta é só sua e tem tempo limite. Há uma espera entre perguntas e você não recebe a mesma pergunta por um tempo. Toda pergunta tem uma fonte."
  related: [xp, cooldown, sequencia]
  bot: jarvis
- id: missao
  term: "Missões"
  aliases: [missao, missão, missoes, grupo, equipe]
  summary: "Histórias curtas com escolhas, sozinho ou com até 3 amigos. Use /missao lista e /missao iniciar."
  details: "Cada missão abre um tópico. Você escolhe com botões; em grupo, a maioria decide e o líder desempata. Algumas missões têm lutas contra o ULTRON, conduzidas pelo Sentinel. Sucesso e fracasso dão XP; abandonar não dá. Há limite de missões diárias e semanais, e cada história só pode ser jogada uma vez."
  related: [xp, trivia]
  bot: jarvis
- id: cooldown
  term: "Cooldown"
  aliases: [espera, tempo de espera, limite]
  summary: "Tempo de espera entre usos de um comando, para evitar spam (por exemplo, entre perguntas de trivia)."
  details: "Se você usar um comando rápido demais, o bot diz quantos segundos faltam. Os tempos são definidos pela staff na configuração."
  related: [trivia]
- id: tutorial
  term: "Tutorial"
  aliases: [missões iniciais, passos]
  summary: "Passos curtos que o H.E.R.B.I.E. passa para quem acabou de chegar. Veja com /tutorial."
  details: "Cada passo concluído dá XP (com o J.A.R.V.I.S. ligado). Dá para pular e recomeçar depois com /tutorial reiniciar, sem ganhar XP de novo pelo que já fez."
  related: [xp]
- id: combate
  term: "Combate"
  aliases: [luta, batalha, duelo]
  summary: "Disputas entre heróis em turnos, decididas por atributos e um pouco de sorte."
  details: "Lutas em turnos com botões Atacar, Poder e Defender. Treine com /treino; missões com luta, invasões e raids usam o mesmo sistema. Todo combate tem semente e pode ser conferido pela staff. Regras completas em docs/COMBAT.md."
  related: [poder, defesa, velocidade, foco]
  bot: sentinel
- id: poder
  term: "Ataque (ATQ)"
  aliases: [ataque, atq, força, poder]
  summary: "Atributo de combate que define o dano dos seus golpes."
  details: "Ataque (ATQ): soma no dano do botão Atacar. Sobe 1 por nível; o arquétipo define a base."
  related: [combate]
  bot: sentinel
- id: defesa
  term: "Defesa"
  aliases: [resistência, armadura]
  summary: "Atributo de combate que reduz o dano recebido."
  details: "Defesa (DEF): tira dano de cada golpe recebido. Defender ainda corta o dano pela metade naquela rodada."
  related: [combate]
  bot: sentinel
- id: velocidade
  term: "Velocidade"
  aliases: [rapidez, iniciativa]
  summary: "Atributo de combate que define quem age primeiro."
  details: "Velocidade (VEL): quem tem mais age primeiro na rodada, e ela ajuda a acertar e a desviar."
  related: [combate]
  bot: sentinel
- id: foco
  term: "Foco"
  aliases: [concentração, precisão]
  summary: "Atributo de combate ligado a acertos e efeitos especiais."
  details: "Foco (FOCO): define o dano do botão Poder, que fica alguns turnos em recarga depois de usado."
  related: [combate]
  bot: sentinel
- id: evento-mundial
  term: "Evento mundial"
  aliases: [invasão, evento, world event]
  summary: "Acontecimentos que afetam o servidor inteiro, anunciados pelo ULTRON. Todo mundo pode participar."
  details: "O ULTRON anuncia invasões (toda semana) e raids com chefe no canal de eventos. Clique em Atacar para uma luta rápida que dá XP, ganhando ou perdendo. Veja a ameaça atual com /ameaca."
  related: [raid]
  bot: ultron
- id: raid
  term: "Raid"
  aliases: [ataque em grupo, chefe]
  summary: "Evento em grupo contra um inimigo forte, com tempo limitado."
  details: "Um chefe aparece num tópico por tempo limitado e todo mundo ataca o mesmo HP. Cada Atacar é uma luta rápida; o grupo vence se zerar o chefe a tempo."
  related: [evento-mundial]
  bot: ultron
- id: denuncia
  term: "Denúncia"
  aliases: [report, reportar, denunciar]
  summary: "Como avisar a staff sobre algo errado no servidor, de forma privada."
  details: "Use /denunciar ou, numa mensagem, Apps → Denunciar mensagem. O Sentinel manda para a fila da staff, e só a staff vê quem denunciou."
  related: [cooldown]
  bot: sentinel
