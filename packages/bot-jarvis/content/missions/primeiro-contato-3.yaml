# Tutorial chapter 3: the first fight (needs ULTRON and Sentinel). Format: docs/MISSIONS.md
id: primeiro-contato-3
kind: story
campaign: { id: primeiro-contato, chapter: 3 }
requires: { missions: [primeiro-contato-2] }
title:
  pt-BR: "Primeiro contato 3: A unidade de varredura"
  en: "First contact 3: The sweep unit"
summary:
  pt-BR: A unidade de varredura do ULTRON chegou à escola. É hora do seu primeiro confronto.
  en: ULTRON's sweep unit has reached the school. Time for your first fight.
minLevel: 1
party: 1
difficulty: facil
start: alerta
scenes:
  alerta:
    text:
      pt-BR: Na hora prevista, o Cérebro detecta a assinatura metálica no bosque atrás da escola. Ela está escaneando cada mutante que passa.
      en: Right on time, Cérebro picks up the metallic signature in the woods behind the school. It is scanning every mutant that walks by.
    choices:
      - label: { pt-BR: Ir direto até ela, en: Go straight at it }
        next: confronto
      - label: { pt-BR: Avisar os outros primeiro, en: Warn the others first }
        next: aviso
  aviso:
    text:
      pt-BR: Os outros alunos se abrigam a tempo. A unidade percebe o movimento e vem atrás de você.
      en: The other students take cover in time. The unit notices the movement and comes after you.
    choices:
      - label: { pt-BR: Enfrentar a unidade, en: Face the unit }
        next: confronto
      - label: { pt-BR: Atraí-la para a clareira, en: Lure it into the clearing }
        next: confronto
  confronto:
    text:
      pt-BR: A unidade de varredura ativa as armas. "MUTANTE IDENTIFICADO. INICIANDO CONTENÇÃO."
      en: The sweep unit powers up its weapons. "MUTANT IDENTIFIED. BEGINNING CONTAINMENT."
    combat: { win: vitoria, lose: derrota }
  vitoria:
    text:
      pt-BR: A unidade cai em faíscas. Nos destroços, um chip com o símbolo do ULTRON. Isto foi só o começo, e a Legião agora sabe o seu nome.
      en: The unit falls in a shower of sparks. In the wreck, a chip with ULTRON's mark. This was only the beginning, and the Legion now knows your name.
    end: success
  derrota:
    text:
      pt-BR: A unidade escapa com dados sobre você. Treine um pouco e tente de novo; o capítulo continua aberto.
      en: The unit escapes with data about you. Train a little and try again; the chapter stays open.
    end: failure
