# Story mission with a fight (needs ULTRON and Sentinel).
id: primeiro-contato
kind: story
title:
  pt-BR: Primeiro contato
  en: First contact
summary:
  pt-BR: Uma unidade de varredura do ULTRON foi vista perto da escola. É hora do seu primeiro confronto.
  en: An ULTRON sweep unit was seen near the school. Time for your first fight.
minLevel: 1
party: 1
difficulty: facil
start: alerta
scenes:
  alerta:
    text:
      pt-BR: O Cérebro detecta uma assinatura metálica no bosque atrás da escola. Ela está escaneando cada mutante que passa.
      en: Cérebro picks up a metallic signature in the woods behind the school. It is scanning every mutant that walks by.
    choices:
      - label: { pt-BR: Ir direto até ela, en: Go straight at it }
        next: confronto
      - label: { pt-BR: Avisar os outros primeiro, en: Warn the others first }
        next: aviso
  aviso:
    text:
      pt-BR: Os outros alunos se abrigam a tempo. A unidade percebe o movimento e vem atrás de você.
      en: The other students take cover in time. The unit notices the movement and comes after you.
    choices:
      - label: { pt-BR: Enfrentar a unidade, en: Face the unit }
        next: confronto
      - label: { pt-BR: Atraí-la para a clareira, en: Lure it into the clearing }
        next: confronto
  confronto:
    text:
      pt-BR: A unidade de varredura ativa as armas. "MUTANTE IDENTIFICADO. INICIANDO CONTENÇÃO."
      en: The sweep unit powers up its weapons. "MUTANT IDENTIFIED. BEGINNING CONTAINMENT."
    combat: { win: vitoria, lose: derrota }
  vitoria:
    text:
      pt-BR: A unidade cai em faíscas. Nos destroços, um chip com o símbolo do ULTRON. Isto foi só o começo.
      en: The unit falls in a shower of sparks. In the wreck, a chip with ULTRON's mark. This was only the beginning.
    end: success
  derrota:
    text:
      pt-BR: A unidade escapa com dados sobre você. Você vai precisar treinar mais antes do próximo encontro.
      en: The unit escapes with data about you. You will need more training before the next encounter.
    end: failure
