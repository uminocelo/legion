# Catálogo de poderes do Cérebro. Só nomes genéricos (o filtro de nomes canônicos vale aqui).
# Sobrescreva ou acrescente em ./data/content/powers.yaml (mesmo id = substitui). Formato: docs/POWERS.md
# Tipos: offensive, defensive, psionic, elemental, movement, utility. O tipo do poder principal define o arquétipo
# (cerebro.powers.typeToArchetype). Poderes não têm efeito numérico além do arquétipo.
# origins: quais origens podem escolher o poder (sem a chave = todas). Origens: mutante, inumano, ciencia,
# tecnologia, mistico, cosmico, treinado. Cada origem precisa de poderes de pelo menos 2 tipos.
- id: rajada-optica
  type: offensive
  origins: [mutante, inumano, ciencia, mistico, cosmico]
  name: { pt-BR: "Rajada óptica", en: "Optic blast" }
  description:
    { pt-BR: "Dispara energia concussiva pelos olhos.", en: "Fires concussive energy from the eyes." }
- id: garras-retrateis
  type: offensive
  origins: [mutante, inumano, ciencia, tecnologia]
  name: { pt-BR: "Garras retráteis", en: "Retractable claws" }
  description:
    { pt-BR: "Lâminas que saem do corpo quando preciso.", en: "Blades that slide out of the body on demand." }
- id: carga-cinetica
  type: offensive
  origins: [mutante, inumano, ciencia, mistico, cosmico]
  name: { pt-BR: "Carga cinética", en: "Kinetic charge" }
  description:
