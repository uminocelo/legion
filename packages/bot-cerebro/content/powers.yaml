# Catálogo de poderes do Cérebro. Só nomes genéricos (o filtro de nomes canônicos vale aqui).
# Sobrescreva ou acrescente em ./data/content/powers.yaml (mesmo id = substitui). Formato: docs/POWERS.md
# Tipos: offensive, defensive, psionic, elemental, movement, utility. O tipo do poder principal define o arquétipo
# (cerebro.powers.typeToArchetype). Poderes não têm efeito numérico além do arquétipo.
- id: rajada-optica
  type: offensive
  name: { pt-BR: "Rajada óptica", en: "Optic blast" }
  description:
    { pt-BR: "Dispara energia concussiva pelos olhos.", en: "Fires concussive energy from the eyes." }
- id: garras-retrateis
  type: offensive
  name: { pt-BR: "Garras retráteis", en: "Retractable claws" }
  description:
    { pt-BR: "Lâminas que saem do corpo quando preciso.", en: "Blades that slide out of the body on demand." }
- id: carga-cinetica
  type: offensive
  name: { pt-BR: "Carga cinética", en: "Kinetic charge" }
  description:
    {
      pt-BR: "Carrega objetos com energia que explode no impacto.",
      en: "Charges objects with energy that bursts on impact.",
    }
- id: pirocinese
  type: offensive
  name: { pt-BR: "Pirocinese", en: "Pyrokinesis" }
  description: { pt-BR: "Cria e controla fogo.", en: "Creates and controls fire." }
- id: grito-sonico
  type: offensive
  name: { pt-BR: "Grito sônico", en: "Sonic scream" }
  description: { pt-BR: "Um grito que vira onda de choque.", en: "A scream that becomes a shockwave." }
- id: projeteis-osseos
  type: offensive
  name: { pt-BR: "Projéteis ósseos", en: "Bone spikes" }
  description:
    { pt-BR: "Lança espinhos feitos do próprio esqueleto.", en: "Launches spikes grown from the skeleton." }
- id: arco-bioeletrico
  type: offensive
  name: { pt-BR: "Arco bioelétrico", en: "Bio-electric arc" }
  description:
    { pt-BR: "Descarrega eletricidade gerada pelo corpo.", en: "Discharges electricity made by the body." }
- id: regeneracao
  type: defensive
  name: { pt-BR: "Regeneração celular", en: "Cellular regeneration" }
  description: { pt-BR: "Feridas fecham em minutos.", en: "Wounds close in minutes." }
- id: blindagem-organica
  type: defensive
  name: { pt-BR: "Blindagem orgânica", en: "Organic armor" }
  description: { pt-BR: "A pele vira uma couraça metálica.", en: "Skin turns into a metal shell." }
- id: corpo-cristalino
  type: defensive
  name: { pt-BR: "Corpo cristalino", en: "Crystal body" }
  description:
    { pt-BR: "O corpo se torna um cristal duríssimo.", en: "The body becomes a very hard crystal." }
- id: campo-de-forca
  type: defensive
  name: { pt-BR: "Campo de força", en: "Force field" }
  description: { pt-BR: "Ergue barreiras de energia.", en: "Raises energy barriers." }
- id: absorcao-de-impacto
  type: defensive
  name: { pt-BR: "Absorção de impacto", en: "Impact absorption" }
  description:
    { pt-BR: "Golpes recebidos viram energia guardada.", en: "Blows taken turn into stored energy." }
- id: controle-de-densidade
  type: defensive
  name: { pt-BR: "Controle de densidade", en: "Density control" }
  description:
    {
      pt-BR: "Fica leve como pena ou pesado como pedra.",
      en: "Becomes light as a feather or heavy as stone.",
    }
- id: telepatia
  type: psionic
  name: { pt-BR: "Telepatia", en: "Telepathy" }
  description: { pt-BR: "Lê e envia pensamentos.", en: "Reads and sends thoughts." }
- id: telecinese
  type: psionic
  name: { pt-BR: "Telecinese", en: "Telekinesis" }
  description: { pt-BR: "Move objetos com a mente.", en: "Moves objects with the mind." }
- id: projecao-astral
  type: psionic
  name: { pt-BR: "Projeção astral", en: "Astral projection" }
  description: { pt-BR: "A mente viaja fora do corpo.", en: "The mind travels outside the body." }
- id: sugestao-neural
  type: psionic
  name: { pt-BR: "Sugestão neural", en: "Neural suggestion" }
  description:
    { pt-BR: "Planta ideias e comandos na mente alheia.", en: "Plants ideas and commands in other minds." }
- id: ilusoes
  type: psionic
  name: { pt-BR: "Ilusões psíquicas", en: "Psychic illusions" }
  description: { pt-BR: "Faz os outros verem o que não existe.", en: "Makes others see what is not there." }
- id: precognicao
  type: psionic
  name: { pt-BR: "Precognição", en: "Precognition" }
  description: { pt-BR: "Pressente o perigo segundos antes.", en: "Senses danger seconds before it comes." }
- id: atmocinese
  type: elemental
  name: { pt-BR: "Atmocinese", en: "Atmokinesis" }
  description: { pt-BR: "Controla vento, chuva e raios.", en: "Controls wind, rain and lightning." }
- id: eletromagnetismo
  type: elemental
  name: { pt-BR: "Eletromagnetismo", en: "Electromagnetism" }
  description: { pt-BR: "Manipula metal e campos magnéticos.", en: "Bends metal and magnetic fields." }
- id: criocinese
  type: elemental
  name: { pt-BR: "Criocinese", en: "Cryokinesis" }
  description: { pt-BR: "Congela o ar e cria gelo.", en: "Freezes the air and makes ice." }
- id: geocinese
  type: elemental
  name: { pt-BR: "Geocinese", en: "Geokinesis" }
  description: { pt-BR: "Move terra e provoca tremores.", en: "Moves earth and causes tremors." }
- id: teletransporte
  type: movement
  name: { pt-BR: "Teletransporte", en: "Teleportation" }
  description: { pt-BR: "Some e reaparece em outro lugar.", en: "Vanishes and reappears elsewhere." }
- id: voo
  type: movement
  name: { pt-BR: "Voo", en: "Flight" }
  description: { pt-BR: "Voa vencendo a gravidade.", en: "Flies against gravity." }
- id: supervelocidade
  type: movement
  name: { pt-BR: "Supervelocidade", en: "Super speed" }
  description: { pt-BR: "Corre mais rápido que o olho vê.", en: "Runs faster than the eye can follow." }
- id: portais
  type: movement
  name: { pt-BR: "Portais", en: "Portals" }
  description: { pt-BR: "Abre passagens entre dois pontos.", en: "Opens passages between two places." }
- id: drenagem
  type: utility
  name: { pt-BR: "Drenagem de energia", en: "Energy siphon" }
  description:
    { pt-BR: "Ao tocar, absorve energia e habilidades.", en: "Absorbs energy and abilities by touch." }
- id: intangibilidade
  type: utility
  name: { pt-BR: "Intangibilidade", en: "Phasing" }
  description: { pt-BR: "Atravessa paredes e golpes.", en: "Passes through walls and blows." }
- id: metamorfose
  type: utility
  name: { pt-BR: "Metamorfose", en: "Shapeshifting" }
  description: { pt-BR: "Muda de aparência à vontade.", en: "Changes appearance at will." }
- id: tecnopatia
  type: utility
  name: { pt-BR: "Tecnopatia", en: "Technopathy" }
  description: { pt-BR: "Conversa com máquinas e redes.", en: "Talks to machines and networks." }
- id: sorte
  type: utility
  name: { pt-BR: "Manipulação de sorte", en: "Luck aura" }
  description: { pt-BR: "A probabilidade pende a seu favor.", en: "Probability bends in your favor." }
